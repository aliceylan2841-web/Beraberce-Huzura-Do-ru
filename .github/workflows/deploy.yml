name: Firebase'e Yayınla

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Firebase CLI kur
        run: npm install --global firebase-tools

      - name: Firebase kimlik bilgisini hazırla
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "HATA: FIREBASE_SERVICE_ACCOUNT secret tanımlı değil."
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" \
            > "$RUNNER_TEMP/firebase-service-account.json"

          if ! python -m json.tool \
            "$RUNNER_TEMP/firebase-service-account.json" > /dev/null; then
            echo "HATA: FIREBASE_SERVICE_ACCOUNT geçerli JSON değil."
            exit 1
          fi

          echo "Firebase servis hesabı hazırlandı."

      - name: Firebase bağlantısını kontrol et
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "HATA: FIREBASE_PROJECT_ID secret tanımlı değil."
            exit 1
          fi

          firebase projects:list \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Firebase Hosting ve Firestore kurallarını yayınla
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          firebase deploy \
            --only hosting,firestore:rules \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
