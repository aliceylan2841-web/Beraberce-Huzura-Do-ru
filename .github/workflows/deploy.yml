name: Firebase'e Yayınla

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firebase CLI kur
        run: npm install -g firebase-tools

      # Blaze planına geçince aşağıdaki adımı açın (başındaki # işaretlerini silin):
      # - name: Cloud Function bağımlılıklarını kur
      #   run: cd functions && npm install

      - name: Firebase kimlik bilgisini hazırla
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$SA_KEY" > "$HOME/firebase-service-account.json"

      - name: Kimlik dosyasını doğrula (teşhis)
        run: |
          echo "Dosya boyutu (byte):"
          wc -c < "$HOME/firebase-service-account.json"
          echo "Geçerli JSON mu ve gerekli alanlar var mı:"
          node -e "
            const fs=require('fs');
            const d=JSON.parse(fs.readFileSync(process.env.HOME+'/firebase-service-account.json','utf8'));
            console.log('type:', d.type);
            console.log('project_id:', d.project_id);
            console.log('client_email var mı:', !!d.client_email);
            console.log('private_key var mı:', !!d.private_key);
          "

      - name: Yayınla (Hosting + Firestore kuralları)
        # NOT: Cloud Functions (AI dua-doldurma özelliği) şu an listede DEĞİL,
        # çünkü bunun için Firebase Blaze planı gerekiyor. Blaze'e geçtiğinizde
        # bu satırı şuna çevirin:
        #   firebase deploy --only hosting,firestore:rules,functions --project ...
        run: firebase deploy --only hosting,firestore:rules --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/firebase-service-account.json
